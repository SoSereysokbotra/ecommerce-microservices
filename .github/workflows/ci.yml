name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  build-and-test:
    name: Lint · Build · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: |
          npm install
          npm install --prefix libs/common
          npm install --prefix libs/rabbitmq
          npm install --prefix apps/api-gateway
          npm install --prefix apps/users-service
          npm install --prefix apps/catalog-service
          npm install --prefix apps/inventory-service
          npm install --prefix apps/orders-service
          npm install --prefix apps/payments-service

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: |
          npx tsc --noEmit -p apps/api-gateway/tsconfig.json
          npx tsc --noEmit -p apps/users-service/tsconfig.json
          npx tsc --noEmit -p apps/catalog-service/tsconfig.json
          npx tsc --noEmit -p apps/inventory-service/tsconfig.json
          npx tsc --noEmit -p apps/orders-service/tsconfig.json
          npx tsc --noEmit -p apps/payments-service/tsconfig.json

      # --passWithNoTests keeps the pipeline honest for services that do not
      # have specs yet, instead of failing on Jest's "no tests found" exit 1.
      - name: Test
        run: npm run test:all

  api-types:
    name: API types are current
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Regenerates types from the committed OpenAPI documents. Needs no
      # database and no running service, so it can gate every pull request.
      #
      # This job is why the previous project's bug cannot happen here: the
      # frontend's types came from a hand-maintained copy that silently drifted
      # from the backend, and a call to a route that did not exist shipped.
      - name: Regenerate types from committed specs
        run: bash scripts/gen-api-types.sh

      - name: Fail if the committed types are stale
        run: |
          if ! git diff --exit-code -- libs/api-types; then
            echo "::error::libs/api-types is out of date. Run 'npm run gen:spec && npm run gen:types' with the stack up, then commit."
            exit 1
          fi
          echo "API types match the committed specs."

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed credentials
        run: bash scripts/scan-secrets.sh
