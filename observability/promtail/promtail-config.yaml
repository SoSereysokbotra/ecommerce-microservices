server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs: attrs
            tag: tag
      - regex:
          expression: '^/var/lib/docker/containers/(?P<container_id>[a-f0-9]+)/.*'
          source: filename
      - labels:
          stream:
          container_id:
      - json:
          expressions:
            service: service
            traceId: traceId
            spanId: spanId
            correlationId: correlationId
            level: level
          source: output
      - labels:
          service:
          traceId:
          correlationId:
          level:
