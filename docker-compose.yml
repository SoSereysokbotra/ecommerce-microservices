name: commerce

# Databases are NOT in this file. Every service connects to its own Neon
# PostgreSQL instance via DATABASE_URL in apps/<service>/.env.
# See docs/adr/0001-new-repo-and-reuse.md.

services:
  # ---------------------------------------------------------------- infrastructure
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: commerce-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [commerce]

  redis:
    image: redis:7-alpine
    container_name: commerce-redis
    restart: unless-stopped
    ports:
      # 6380 on the host, not 6379. Every service reaches Redis at
      # `redis://redis:6379` on the Docker network, so nothing in this project
      # needs the standard port published — and publishing it collided with
      # another project's `jobfit-redis`, which made `docker compose up` fail
      # with "Bind for 0.0.0.0:6379 failed" until that container was stopped by
      # hand. A port nobody uses is not worth a manual step before every start.
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [commerce]

  # ---------------------------------------------------------------------- services
  users-service:
    build:
      context: .
      dockerfile: ./apps/users-service/Dockerfile
      target: development
    container_name: commerce-users-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./apps/users-service/.env
    volumes:
      - .:/app
      - users_service_node_modules:/app/apps/users-service/node_modules
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Readiness, not liveness: /ready queries Neon, so the gateway does not
      # start until this service can actually reach its database.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/v1/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 12
      # 90s, not 40s: ts-node takes ~29s to register before Nest logs a line,
      # and a cold Neon endpoint has taken ~50s to accept its first connection.
      # A short window marks the container unhealthy while it is still starting,
      # which then fails every service that depends on it.
      start_period: 90s
    networks: [commerce]

  catalog-service:
    build:
      context: .
      dockerfile: ./apps/catalog-service/Dockerfile
      target: development
    container_name: commerce-catalog-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - ./apps/catalog-service/.env
    volumes:
      - .:/app
      - catalog_service_node_modules:/app/apps/catalog-service/node_modules
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/api/v1/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 12
      # 90s, not 40s: ts-node takes ~29s to register before Nest logs a line,
      # and a cold Neon endpoint has taken ~50s to accept its first connection.
      # A short window marks the container unhealthy while it is still starting,
      # which then fails every service that depends on it.
      start_period: 90s
    networks: [commerce]

  inventory-service:
    build:
      context: .
      dockerfile: ./apps/inventory-service/Dockerfile
      target: development
    container_name: commerce-inventory-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    env_file:
      - ./apps/inventory-service/.env
    volumes:
      - .:/app
      - inventory_service_node_modules:/app/apps/inventory-service/node_modules
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/api/v1/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 12
      # 90s, not 40s: ts-node takes ~29s to register before Nest logs a line,
      # and a cold Neon endpoint has taken ~50s to accept its first connection.
      # A short window marks the container unhealthy while it is still starting,
      # which then fails every service that depends on it.
      start_period: 90s
    networks: [commerce]

  payments-service:
    build:
      context: .
      dockerfile: ./apps/payments-service/Dockerfile
      target: development
    container_name: commerce-payments-service
    restart: unless-stopped
    ports:
      - "3005:3005"
    env_file:
      - ./apps/payments-service/.env
    volumes:
      - .:/app
      - payments_service_node_modules:/app/apps/payments-service/node_modules
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3005/api/v1/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 12
      # 90s, not 40s: ts-node takes ~29s to register before Nest logs a line,
      # and a cold Neon endpoint has taken ~50s to accept its first connection.
      # A short window marks the container unhealthy while it is still starting,
      # which then fails every service that depends on it.
      start_period: 90s
    networks: [commerce]

  orders-service:
    build:
      context: .
      dockerfile: ./apps/orders-service/Dockerfile
      target: development
    container_name: commerce-orders-service
    restart: unless-stopped
    ports:
      - "3004:3004"
    env_file:
      - ./apps/orders-service/.env
    volumes:
      - .:/app
      - orders_service_node_modules:/app/apps/orders-service/node_modules
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      # M8: orders no longer calls catalog directly — it asks pricing, which
      # reads catalog itself and already waits for it. Depending on pricing is
      # the real dependency and still covers catalog transitively.
      pricing-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payments-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3004/api/v1/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 12
      # Raised from 40s in M8. ts-node registration alone takes ~29s in this
      # environment before Nest logs a line, and orders now waits on pricing as
      # well as a cold Neon endpoint — 40s marked the container unhealthy while
      # it was still starting, which the gateway then refused to start behind.
      # Matches cart-service and pricing-service.
      start_period: 90s
    networks: [commerce]

  cart-service:
    build:
      context: .
      dockerfile: ./apps/cart-service/Dockerfile
      target: development
    container_name: commerce-cart-service
    restart: unless-stopped
    ports:
      - "3006:3006"
    env_file:
      - ./apps/cart-service/.env
    volumes:
      - .:/app
      - cart_service_node_modules:/app/apps/cart-service/node_modules
    depends_on:
      rabbitmq:
        condition: service_healthy
      # Unlike every other service, this one genuinely uses Redis: guest carts
      # live there with a TTL rather than in Postgres.
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3006/api/v1/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 12
      # Longer than the other services: /ready here also pings Redis, and a cold
      # Neon endpoint has taken ~50s to accept the first connection, which was
      # enough to mark this container unhealthy while it was still starting —
      # and the gateway waits on it being healthy.
      start_period: 90s
    networks: [commerce]

  pricing-service:
    build:
      context: .
      dockerfile: ./apps/pricing-service/Dockerfile
      target: development
    container_name: commerce-pricing-service
    restart: unless-stopped
    ports:
      - "3007:3007"
    env_file:
      - ./apps/pricing-service/.env
    volumes:
      - .:/app
      - pricing_service_node_modules:/app/apps/pricing-service/node_modules
    depends_on:
      # No redis — pricing caches nothing. RabbitMQ arrived in M9: a coupon
      # redemption is state and must be released when its order is cancelled,
      # which reaches this service as an event.
      rabbitmq:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3007/api/v1/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 12
      # Same 90s as cart-service, and for the same reason: a cold Neon endpoint
      # has taken ~50s to accept its first connection, which is long enough to
      # mark the container unhealthy while it is still starting — and the
      # gateway waits on it being healthy.
      start_period: 90s
    networks: [commerce]

  shipping-service:
    build:
      context: .
      dockerfile: ./apps/shipping-service/Dockerfile
      target: development
    container_name: commerce-shipping-service
    restart: unless-stopped
    ports:
      - "3008:3008"
    env_file:
      - ./apps/shipping-service/.env
    volumes:
      - .:/app
      - shipping_service_node_modules:/app/apps/shipping-service/node_modules
    depends_on:
      # No redis and no catalog: a rate is computed entirely from this service's
      # own zone and rate tables, which is what lets pricing-service treat it as
      # one more read. RabbitMQ is declared from the scaffold because step 7 of
      # docs/M10_SHIPPING_PLAN.md consumes `order.confirmed` to create shipments,
      # and a dependency added later is a recreate of every dependent service.
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3008/api/v1/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 12
      # Same 90s as cart-service and pricing-service, for the same reason: a
      # cold Neon endpoint has taken ~50s to accept its first connection, long
      # enough to mark the container unhealthy while it is still starting — and
      # the gateway waits on it being healthy.
      start_period: 90s
    networks: [commerce]

  api-gateway:
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
      target: development
    container_name: commerce-api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./apps/api-gateway/.env
    volumes:
      - .:/app
      - api_gateway_node_modules:/app/apps/api-gateway/node_modules
    depends_on:
      users-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
      payments-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
      shipping-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/v1/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [commerce]

volumes:
  rabbitmq_data:
  redis_data:
  users_service_node_modules:
  catalog_service_node_modules:
  inventory_service_node_modules:
  orders_service_node_modules:
  payments_service_node_modules:
  api_gateway_node_modules:
  cart_service_node_modules:
  pricing_service_node_modules:
  shipping_service_node_modules:

networks:
  commerce:
    driver: bridge
