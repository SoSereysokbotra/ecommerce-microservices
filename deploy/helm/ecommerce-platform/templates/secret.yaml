apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ecommerce-platform.fullname" . }}-secrets
  labels:
    {{- include "ecommerce-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | quote }}
  DATABASE_URL_USERS: {{ .Values.secrets.databases.users | quote }}
  DATABASE_URL_CATALOG: {{ .Values.secrets.databases.catalog | quote }}
  DATABASE_URL_ORDERS: {{ .Values.secrets.databases.orders | quote }}
  DATABASE_URL_PAYMENTS: {{ .Values.secrets.databases.payments | quote }}
  DATABASE_URL_INVENTORY: {{ .Values.secrets.databases.inventory | quote }}
  DATABASE_URL_SHIPPING: {{ .Values.secrets.databases.shipping | quote }}
  DATABASE_URL_REVIEWS: {{ .Values.secrets.databases.reviews | quote }}
  DATABASE_URL_PRICING: {{ .Values.secrets.databases.pricing | quote }}
