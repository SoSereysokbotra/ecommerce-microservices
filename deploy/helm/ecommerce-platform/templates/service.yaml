{{- $root := . -}}
{{- range $serviceName, $serviceConfig := .Values.services }}
{{- if $serviceConfig.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecommerce-platform.fullname" $root }}-{{ $serviceName }}
  labels:
    app: {{ $serviceName }}
    app.kubernetes.io/name: {{ $serviceName }}
    {{- include "ecommerce-platform.labels" $root | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $serviceConfig.port }}
      targetPort: {{ $serviceConfig.port }}
      name: http
  selector:
    app: {{ $serviceName }}
{{- end }}
{{- end }}
