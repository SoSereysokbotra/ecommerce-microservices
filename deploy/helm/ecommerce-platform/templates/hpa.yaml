{{- $root := . -}}
{{- range $serviceName, $serviceConfig := .Values.services }}
{{- if and $serviceConfig.enabled $serviceConfig.autoscaling $serviceConfig.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ecommerce-platform.fullname" $root }}-{{ $serviceName }}-hpa
  labels:
    app: {{ $serviceName }}
    {{- include "ecommerce-platform.labels" $root | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ecommerce-platform.fullname" $root }}-{{ $serviceName }}
  minReplicas: {{ $serviceConfig.autoscaling.minReplicas | default 2 }}
  maxReplicas: {{ $serviceConfig.autoscaling.maxReplicas | default 8 }}
  metrics:
    {{- if $serviceConfig.autoscaling.targetCPU }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $serviceConfig.autoscaling.targetCPU }}
    {{- end }}
    {{- if $serviceConfig.autoscaling.targetMemory }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $serviceConfig.autoscaling.targetMemory }}
    {{- end }}
{{- end }}
{{- end }}
