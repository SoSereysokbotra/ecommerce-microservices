{{- $root := . -}}
{{- range $serviceName, $serviceConfig := .Values.services }}
{{- if $serviceConfig.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecommerce-platform.fullname" $root }}-{{ $serviceName }}
  labels:
    app: {{ $serviceName }}
    app.kubernetes.io/name: {{ $serviceName }}
    {{- include "ecommerce-platform.labels" $root | nindent 4 }}
spec:
  replicas: {{ $serviceConfig.replicas | default 2 }}
  selector:
    matchLabels:
      app: {{ $serviceName }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ $serviceName }}
        app.kubernetes.io/name: {{ $serviceName }}
        {{- include "ecommerce-platform.labels" $root | nindent 8 }}
    spec:
      containers:
        - name: {{ $serviceName }}
          image: "{{ $root.Values.global.imageRegistry }}/{{ $serviceConfig.image.repository }}:{{ $serviceConfig.image.tag }}"
          imagePullPolicy: {{ $serviceConfig.image.pullPolicy }}
          ports:
            - containerPort: {{ $serviceConfig.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "ecommerce-platform.fullname" $root }}-config
          env:
            - name: PORT
              value: "{{ $serviceConfig.port }}"
            {{- if eq $serviceName "api-gateway" }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecommerce-platform.fullname" $root }}-secrets
                  key: JWT_SECRET
            {{- end }}
            {{- if eq $serviceName "users-service" }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecommerce-platform.fullname" $root }}-secrets
                  key: DATABASE_URL_USERS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecommerce-platform.fullname" $root }}-secrets
                  key: JWT_SECRET
            {{- end }}
            {{- if eq $serviceName "catalog-service" }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecommerce-platform.fullname" $root }}-secrets
                  key: DATABASE_URL_CATALOG
            {{- end }}
            {{- if eq $serviceName "orders-service" }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecommerce-platform.fullname" $root }}-secrets
                  key: DATABASE_URL_ORDERS
            {{- end }}
            {{- if eq $serviceName "payments-service" }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecommerce-platform.fullname" $root }}-secrets
                  key: DATABASE_URL_PAYMENTS
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecommerce-platform.fullname" $root }}-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecommerce-platform.fullname" $root }}-secrets
                  key: STRIPE_WEBHOOK_SECRET
            {{- end }}
            {{- if eq $serviceName "inventory-service" }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecommerce-platform.fullname" $root }}-secrets
                  key: DATABASE_URL_INVENTORY
            {{- end }}
            {{- if eq $serviceName "shipping-service" }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecommerce-platform.fullname" $root }}-secrets
                  key: DATABASE_URL_SHIPPING
            {{- end }}
            {{- if eq $serviceName "reviews-service" }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecommerce-platform.fullname" $root }}-secrets
                  key: DATABASE_URL_REVIEWS
            {{- end }}
            {{- if eq $serviceName "pricing-service" }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecommerce-platform.fullname" $root }}-secrets
                  key: DATABASE_URL_PRICING
            {{- end }}
          resources:
            {{- toYaml $serviceConfig.resources | nindent 12 }}
          {{- if $serviceConfig.probes }}
          livenessProbe:
            httpGet:
              path: {{ $serviceConfig.probes.livenessPath }}
              port: {{ $serviceConfig.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: {{ $serviceConfig.probes.readinessPath }}
              port: {{ $serviceConfig.port }}
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
          {{- end }}
{{- end }}
{{- end }}
