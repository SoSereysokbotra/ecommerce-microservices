global:
  environment: production
  imageRegistry: ""

secretName: commerce-secrets
configMapName: commerce-config

config:
  nodeEnv: production
  logLevel: info
  rabbitmqUrl: "amqp://guest:guest@rabbitmq:5672"
  redisUrl: "redis://redis:6379"
  opensearchNode: "http://opensearch.commerce.svc.cluster.local:9200"
  otelEndpoint: "http://tempo.commerce.svc.cluster.local:4318"
  lokiEndpoint: "http://loki.commerce.svc.cluster.local:3100"

secrets:
  jwtSecret: "placeholder_jwt_secret"
  stripeSecretKey: "placeholder_test_key_not_real"
  stripeWebhookSecret: "whsec_placeholder"
  databases:
    users: "postgresql://postgres:${DB_PASSWORD}@users-db:5432/users"
    catalog: "postgresql://postgres:${DB_PASSWORD}@catalog-db:5432/catalog"
    orders: "postgresql://postgres:${DB_PASSWORD}@orders-db:5432/orders"
    payments: "postgresql://postgres:${DB_PASSWORD}@payments-db:5432/payments"
    inventory: "postgresql://postgres:${DB_PASSWORD}@inventory-db:5432/inventory"
    cart: "postgresql://postgres:${DB_PASSWORD}@cart-db:5432/cart"
    shipping: "postgresql://postgres:${DB_PASSWORD}@shipping-db:5432/shipping"
    reviews: "postgresql://postgres:${DB_PASSWORD}@reviews-db:5432/reviews"
    pricing: "postgresql://postgres:${DB_PASSWORD}@pricing-db:5432/pricing"
    recommendations: "postgresql://postgres:${DB_PASSWORD}@recommendations-db:5432/recommendations"

ingress:
  enabled: true
  className: traefik
  host: commerce.local
  tls:
    enabled: false
    secretName: commerce-tls-cert
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web

networkPolicy:
  enabled: false

services:
  api-gateway:
    enabled: true
    image:
      repository: commerce-api-gateway
      tag: prod
      pullPolicy: IfNotPresent
    replicas: 2
    port: 3000
    probes:
      livenessPath: /api/v1/health
      readinessPath: /api/v1/health
    resources:
      requests:
        cpu: 100m
        memory: 180Mi
      limits:
        cpu: 500m
        memory: 384Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPU: 70
      targetMemory: 80

  users-service:
    enabled: true
    image:
      repository: commerce-users-service
      tag: prod
      pullPolicy: IfNotPresent
    replicas: 1
    port: 3001
    probes:
      livenessPath: /api/v1/health
      readinessPath: /api/v1/ready
    resources:
      requests:
        cpu: 100m
        memory: 180Mi
      limits:
        cpu: 500m
        memory: 384Mi

  catalog-service:
    enabled: true
    image:
      repository: commerce-catalog-service
      tag: prod
      pullPolicy: IfNotPresent
    replicas: 1
    port: 3002
    probes:
      livenessPath: /api/v1/health
