apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: commerce-staging

resources:
  - ../../base

namePrefix: staging-

labels:
  - pairs:
      environment: staging

patches:
  - target:
      kind: Ingress
      name: commerce-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.commerce.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging.commerce.example.com
  - target:
      kind: ConfigMap
      name: commerce-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: "debug"
      - op: replace
        path: /data/NODE_ENV
        value: "staging"
  - target:
      kind: Deployment
      name: .*
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
