apiVersion: v1
kind: ConfigMap
metadata:
  name: commerce-config
  namespace: commerce
  labels:
    app.kubernetes.io/name: commerce-platform
    app.kubernetes.io/part-of: ecommerce-microservices
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  RABBITMQ_URL: "amqp://guest:${RABBITMQ_PASS}@rabbitmq:5672"
  REDIS_URL: "redis://redis.commerce.svc.cluster.local:6379"
  OPENSEARCH_NODE: "http://opensearch.commerce.svc.cluster.local:9200"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo.commerce.svc.cluster.local:4318"
  LOKI_ENDPOINT: "http://loki.commerce.svc.cluster.local:3100"
  API_GATEWAY_PORT: "3000"
  USERS_SERVICE_URL: "http://users-service:3001"
  CATALOG_SERVICE_URL: "http://catalog-service:3002"
  CART_SERVICE_URL: "http://cart-service:3003"
  ORDERS_SERVICE_URL: "http://orders-service:3004"
  PAYMENTS_SERVICE_URL: "http://payments-service:3005"
  INVENTORY_SERVICE_URL: "http://inventory-service:3006"
  SHIPPING_SERVICE_URL: "http://shipping-service:3007"
  REVIEWS_SERVICE_URL: "http://reviews-service:3008"
  PRICING_SERVICE_URL: "http://pricing-service:3009"
  SEARCH_SERVICE_URL: "http://search-service:3010"
  RECOMMENDATIONS_SERVICE_URL: "http://recommendations-service:3011"
  NEXT_PUBLIC_API_URL: "http://api-gateway:3000"
