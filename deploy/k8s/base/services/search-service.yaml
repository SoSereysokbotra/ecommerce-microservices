apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: commerce
  labels:
    app: search-service
    app.kubernetes.io/name: search-service
    app.kubernetes.io/part-of: commerce-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: search-service
        app.kubernetes.io/name: search-service
        app.kubernetes.io/part-of: commerce-platform
    spec:
      containers:
        - name: search-service
          image: ghcr.io/sosereysokbotra/ecommerce-microservices/search-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3010
              name: http
          envFrom:
            - configMapRef:
                name: commerce-config
          env:
            - name: PORT
              value: "3010"
          resources:
            requests:
              cpu: 100m
              memory: 180Mi
            limits:
              cpu: 500m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3010
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 3010
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: commerce
  labels:
    app: search-service
    app.kubernetes.io/name: search-service
    app.kubernetes.io/part-of: commerce-platform
spec:
  type: ClusterIP
  ports:
    - port: 3010
      targetPort: 3010
      name: http
  selector:
    app: search-service
