apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  namespace: commerce
  labels:
    app: users-service
    app.kubernetes.io/name: users-service
    app.kubernetes.io/part-of: commerce-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: users-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: users-service
        app.kubernetes.io/name: users-service
        app.kubernetes.io/part-of: commerce-platform
    spec:
      containers:
        - name: users-service
          image: ghcr.io/sosereysokbotra/ecommerce-microservices/users-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: commerce-config
          env:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: commerce-secrets
                  key: DATABASE_URL_USERS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: commerce-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 180Mi
            limits:
              cpu: 500m
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: users-service
  namespace: commerce
  labels:
    app: users-service
    app.kubernetes.io/name: users-service
    app.kubernetes.io/part-of: commerce-platform
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
      name: http
  selector:
    app: users-service
