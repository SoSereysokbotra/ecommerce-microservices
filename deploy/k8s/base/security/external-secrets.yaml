apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: commerce-platform-external-secrets
  namespace: commerce
  labels:
    app.kubernetes.io/name: commerce-platform
    app.kubernetes.io/part-of: ecommerce-microservices
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: commerce-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: production/commerce/auth
        property: jwt_secret
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: production/commerce/payments
        property: stripe_secret_key
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: production/commerce/payments
        property: stripe_webhook_secret
    - secretKey: RABBITMQ_DEFAULT_PASS
      remoteRef:
        key: production/commerce/infrastructure
        property: rabbitmq_password
    - secretKey: DATABASE_URL_USERS
      remoteRef:
        key: production/commerce/databases
        property: users_db_url
    - secretKey: DATABASE_URL_CATALOG
      remoteRef:
        key: production/commerce/databases
        property: catalog_db_url
    - secretKey: DATABASE_URL_ORDERS
      remoteRef:
        key: production/commerce/databases
        property: orders_db_url
    - secretKey: DATABASE_URL_PAYMENTS
      remoteRef:
        key: production/commerce/databases
        property: payments_db_url
    - secretKey: DATABASE_URL_INVENTORY
      remoteRef:
        key: production/commerce/databases
        property: inventory_db_url
    - secretKey: DATABASE_URL_SHIPPING
      remoteRef:
        key: production/commerce/databases
        property: shipping_db_url
    - secretKey: DATABASE_URL_REVIEWS
      remoteRef:
        key: production/commerce/databases
        property: reviews_db_url
    - secretKey: DATABASE_URL_PRICING
      remoteRef:
        key: production/commerce/databases
        property: pricing_db_url
