apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: commerce
  labels:
    app.kubernetes.io/name: commerce-platform
    app.kubernetes.io/part-of: ecommerce-microservices
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: commerce
  labels:
    app.kubernetes.io/name: commerce-platform
    app.kubernetes.io/part-of: ecommerce-microservices
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "commerce-service-role"
          serviceAccountRef:
            name: external-secrets-sa
