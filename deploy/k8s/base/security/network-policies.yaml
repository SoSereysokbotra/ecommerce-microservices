apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-infrastructure
  namespace: commerce
  labels:
    app.kubernetes.io/name: commerce-platform
    app.kubernetes.io/part-of: ecommerce-microservices
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 5672
        - protocol: TCP
          port: 9200
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 3100
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inter-service-communication
  namespace: commerce
  labels:
    app.kubernetes.io/name: commerce-platform
    app.kubernetes.io/part-of: ecommerce-microservices
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - orders-service
          - pricing-service
          - reviews-service
          - recommendations-service
          - cart-service
          - users-service
          - shipping-service
          - catalog-service
          - inventory-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - orders-service
                  - pricing-service
                  - reviews-service
                  - recommendations-service
                  - cart-service
      ports:
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 3002
        - protocol: TCP
          port: 3006
        - protocol: TCP
          port: 3007
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - users-service
                  - shipping-service
                  - catalog-service
                  - inventory-service
      ports:
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 3002
        - protocol: TCP
          port: 3006
        - protocol: TCP
          port: 3007
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-payments-to-stripe-egress
  namespace: commerce
  labels:
    app.kubernetes.io/name: commerce-platform
    app.kubernetes.io/part-of: ecommerce-microservices
spec:
  podSelector:
    matchLabels:
      app: payments-service
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
